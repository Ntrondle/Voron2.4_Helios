## Fly-SB2040-V2 BOARD PINS
[board_pins SB2040v3]
mcu: SB2040v3
aliases:
aliases_2209:
    EXT_EN=gpio16,EXT_STEP=gpio14,EXT_DIR=gpio13,EXT_UART=gpio15
aliases_endstop:
    LIMIT_0=gpio22,LIMIT_1=gpio20,LIMIT_2=gpio18
aliases_cnc_fans:
    FAN0=gpio24,FAN1=gpio19,FAN2=gpio21
aliases_thermistors:
    TH0=gpio27
aliases_heaters:
    HE0=gpio23
aliases_rgb:
    RGBLED=gpio26
aliases_adxl:
    ADXL=gpio1

[mcu SB2040v3]
canbus_uuid: 58e5d97f944c

[temperature_sensor SB2040v2]
sensor_type: temperature_mcu
sensor_mcu: SB2040v3

[heater_fan hotend_fan]
pin: SB2040v3:FAN1
max_power: 0.89
cycle_time: 0.05
kick_start_time: 1
heater: extruder
heater_temp: 50.0
hardware_pwm: true

[fan]
pin: SB2040v3:FAN0
kick_start_time: 0.25
cycle_time: 0.15
off_below: 0.10

[extruder]
step_pin: SB2040v3:EXT_STEP
dir_pin: !SB2040v3:EXT_DIR
enable_pin: !SB2040v3:EXT_EN

rotation_distance: 47.0474 # ABS ROTATION
#rotation_distance: 12.9900     # PLA ROTATION

gear_ratio: 9:1 				    # 
microsteps: 16                      # 
full_steps_per_rotation: 200	    # 
nozzle_diameter: 0.400              # 
filament_diameter: 1.75           
pressure_advance_smooth_time: 0.040
pressure_advance:0.025

               
min_temp: 10                       
max_temp: 300                      
max_power: 1.0                      
min_extrude_temp: 245             
control = pid                      
pid_Kp=24.788
pid_Ki=1.425
pid_Kd=107.832
max_extrude_only_distance: 500.0
max_extrude_cross_section: 5



heater_pin: SB2040v3:HE0
sensor_pin: SB2040v3:TH0
sensor_type: ATC Semitec 104GT-2  # this is the default for the Revo heater
pullup_resistor: 1000             # Uncomment for PT1000 Sensor with jumper installed. 
control = pid # Sample PID - perform your own PID tuning for accurate results. 
pid_kp = 26.213
pid_ki = 1.304
pid_kd = 131.721
min_temp: 0
max_temp: 275
min_extrude_temp: 150
max_power: 1



[tmc2209 extruder]
uart_pin: SB2040v3:EXT_UART
interpolate:False
run_current: 0.6 
hold_current: 0.2                   # 
sense_resistor: 0.110               #
stealthchop_threshold: 0         



[verify_heater extruder]
max_error: 200           # More tolerance before triggering error
check_gain_time: 40      # Give 40s instead of 20s to rise in temp
heating_gain: 1.5        # Only require 1.5°C temp rise in that time
hysteresis: 5            # Default; no need to change


[mcu scanner]
canbus_uuid: 1fa8234d11b1 
#serial: /dev/serial/by-id/usb-cartographer_cartographer_
#    adjust to suit your scanner, if using usb change to serial

[scanner]
mcu: scanner            
#   Offsets are measured from the centre of your coil, to the tip of your nozzle 
#   on a level axis. It is vital that this is accurate. 
x_offset: 0                          
#    adjust for your cartographers offset from nozzle to middle of coil
y_offset: 15                         
#    adjust for your cartographers offset from nozzle to middle of coil
backlash_comp: 0.0243
#   Backlash compensation distance for removing Z backlash before measuring
#   the sensor response.
sensor: cartographer
#    this must be set as cartographer unless using IDM etc.
sensor_alt: carto
#    alternate name to call commands. CARTO_TOUCH etc      
mesh_runs: 2
#    Number of passes to make during mesh scan.

[bed_mesh]
zero_reference_position: 150, 150    
#    set this to the middle of your bed
speed: 200
#    movement speed of toolhead during bed mesh
horizontal_move_z: 5
#    height of scanner during bed mesh scan
mesh_min: 35, 6
#    start point of bed mesh [X, Y]
mesh_max: 240, 198
#    end point of bed mesh [X, Y]
probe_count: 30, 30
algorithm: bicubic

[temperature_sensor Cartographer_MCU]
sensor_type: temperature_mcu
sensor_mcu: scanner
min_temp: 0
max_temp: 105

[adxl345]
cs_pin: scanner:PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    125, 125, 20

accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0
