############### Config options ##################

[gcode_macro _BEDFANVARS]
variable_threshold: 80        # If bed temp target is above this threshold, fans will be enabled. If below, fans will be disabled.
variable_fast: 1              # Fan speed once bed temp is reached  
variable_slow: 0.7            # Fan speed while bed is heating
variable_door: 0              # Door state: 0 = closed, 1 = open

gcode:

########## Bed Fans #########

[fan_generic BedFans]
pin: PB5
kick_start_time: 0.4

########## Aliases #########

[gcode_macro BEDFANSSLOW]
gcode:
	{% set SLOW = printer["gcode_macro _BEDFANVARS"].slow|float %}
	SET_FAN_SPEED FAN=BedFans SPEED={SLOW}

[gcode_macro BEDFANSFAST]
gcode:
	{% set FAST = printer["gcode_macro _BEDFANVARS"].fast|float %}
	SET_FAN_SPEED FAN=BedFans SPEED={FAST}

[gcode_macro BEDFANSOFF]
gcode:
	SET_FAN_SPEED FAN=BedFans SPEED=0

########## Door Sensor Macros #########
# These macros should be triggered by your door sensor (or endstop)
# when the door opens or closes.

[gcode_macro DOOR_OPEN]
gcode:
    UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=0
    SET_GCODE_VARIABLE MACRO=_BEDFANVARS VARIABLE=door VALUE=1
    BEDFANSOFF
    {action_respond_info("Door opened: Bed fans turned off.")}
    # If a print is currently running, pause it.
        {% if printer.print_stats.state == "printing" %}
        PAUSE
        {action_respond_info("Printing paused due to door open.")}
    {% endif %}

[gcode_macro DOOR_CLOSED]
gcode:
	# Mark door as closed.
	UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=0
    SET_GCODE_VARIABLE MACRO=_BEDFANVARS VARIABLE=door VALUE=0
	{action_respond_info("Door closed: Restoring bed fan control.")}
	# Only restart the fan monitoring loop if the bed target is high.
	{% set THRESHOLD = printer["gcode_macro _BEDFANVARS"].threshold|int %}
	{% if printer.heater_bed.target >= THRESHOLD %}
	    UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=1
	{% else %}
	    BEDFANSOFF
	{% endif %}
    
        # If the printer was paused due to door open, resume printing.
    {% if printer.print_stats.state == "paused" %}
        RESUME
        {action_respond_info("Resuming print as door is closed.")}
    {% endif %}

############ Command overrides ############

# Override SET_HEATER_TEMPERATURE to set the fans and start/stop the monitoring loop.
[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: _SET_HEATER_TEMPERATURE
gcode:
	{% set HEATER = params.HEATER|default("None") %}
	{% set TARGET = params.TARGET|default(0)|int %}
	{% set THRESHOLD = printer["gcode_macro _BEDFANVARS"].threshold|int %}
	
	{% if HEATER|lower == "extruder" %}
		M104 S{TARGET}
	{% elif HEATER|lower == "heater_bed" %}
		M99140 S{TARGET}
	{% else %}
		{action_respond_info("Heater %s not supported" % HEATER)}
	{% endif %}

	{% if HEATER|lower == "heater_bed" %}
	    {% if TARGET >= THRESHOLD %}
	        BEDFANSSLOW
	        UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=1
	    {% else %}
	        BEDFANSOFF
	        UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=0
	    {% endif %}
	{% endif %}
	
# Override M190 (Wait for Bed Temperature)
[gcode_macro M190]
rename_existing: M99190
gcode:
	{% set S = params.S|int %}
	{% set THRESHOLD = printer["gcode_macro _BEDFANVARS"].threshold|int %}
	{% set door = printer["gcode_macro _BEDFANVARS"].door|int %}
	
	{% if door == 1 %}
	    BEDFANSOFF
	{% else %}
	    {% if S >= THRESHOLD %}
	        BEDFANSSLOW      # Use low-speed fans while heating.
	    {% else %}
	        BEDFANSOFF
	    {% endif %}
	{% endif %}
	
	M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
	  
	{% if S != 0 %}
	    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={S} MAXIMUM={S + 5}
	{% endif %}
	
	{% if door == 0 and S >= THRESHOLD %}
	    BEDFANSFAST      # Once near target, use fast fans.
	{% endif %}
	
# Replace M140 (Set Bed Temperature)
[gcode_macro M140]
rename_existing: M99140
gcode:
	{% set S = params.S|float %}
	SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={S}
	
# Replace TURN_OFF_HEATERS
[gcode_macro TURN_OFF_HEATERS]
rename_existing: _TURN_OFF_HEATERS
gcode:
	BEDFANSOFF
	_TURN_OFF_HEATERS
	
################ Monitoring loop #####################
# This loop updates fan speed as the bed heats.
[delayed_gcode bedfanloop]
gcode:
	{% set door = printer["gcode_macro _BEDFANVARS"].door|int %}
	{% set THRESHOLD = printer["gcode_macro _BEDFANVARS"].threshold|int %}
	{% if door == 1 %}
	    # With the door open, ensure the fans stay off.
	    BEDFANSOFF
	{% else %}
	    {% if printer.heater_bed.target >= THRESHOLD %}
	        {% if printer.heater_bed.temperature|int >= (printer.heater_bed.target|int - 1) %}
	            BEDFANSFAST
	        {% else %}
	            BEDFANSSLOW
	            UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=5
	        {% endif %}
	    {% else %}
	        # If the bed target is below the threshold, force fans off.
	        BEDFANSOFF
	    {% endif %}
	{% endif %}
