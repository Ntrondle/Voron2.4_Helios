[output_pin caselight]
pin: PB7
pwm: true
shutdown_value: 0
value: 0.05       # brightness at startup (0-1)
cycle_time: 0.0001



[gcode_button Endstop_LED]
# Use the appropriate endstop pin here. The caret (^) and exclamation (!)
# characters may be needed for proper logic inversion (depending on your wiring).
pin: ^!Turtle_1:PB3

# When the endstop is triggered (i.e. “pressed”), run C_LED_100.
press_gcode:
  C_LED_100
  DOOR_OPEN
  

# When the endstop is released, run C_LED_5.
release_gcode:
  C_LED_5
  BEDFANSSLOW
  DOOR_CLOSED




[gcode_macro C_LED_0]
gcode:
  SET_PIN PIN=caselight VALUE=0.0

[gcode_macro C_LED_5]
gcode:
  SET_PIN PIN=caselight VALUE=0.05

[gcode_macro C_LED_25]
gcode:
  SET_PIN PIN=caselight VALUE=0.25

[gcode_macro C_LED_50]
gcode:
  SET_PIN PIN=caselight VALUE=0.5

[gcode_macro C_LED_100]
gcode:
  SET_PIN PIN=caselight VALUE=1  
